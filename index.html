<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QZY1RPT3RX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-QZY1RPT3RX');
  </script>
  <meta charset="UTF-8">
  <title>Equity168 - 個股資料速覽</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; }
    h1 { background-color: #1e90ff; color: white; padding: 20px 0; margin: 0; }
    .search-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 90%;
      margin: 20px auto;
    }
    select, input, button { margin: 0 5px; padding: 5px; font-size: 1em; }
    iframe { width: 90%; height: 80vh; border: none; }
  </style>
</head>
<body>

  <h1>Equity168 - 個股資料速覽</h1>

  <div class="search-box">
    <select id="pageSelect" onchange="changePage()">
      <option value="main04.html">個股訊號彙總表</option>
      <option value="main02.html">個股估值彙總表</option>
      <option value="main01.html">股價趨勢彙總表</option>
      <option value="main03.html">大盤多空溫度計</option>
      <option value="main05.html">台灣ETF 訊號彙總</option>
      <option value="main06.html">香港股市訊號彙總</option>
      <option value="main07.html">美國股市訊號彙總</option>
      <option value="main08.html">國際股指訊號彙總</option>
      <option value="main09.html">債券市場訊號彙總</option>
      <option value="main10.html">匯率市場訊號彙總</option>
      <option value="main11.html">原物料訊號彙總</option>
    </select>
    <div class="search-controls">
      <input type="text" id="stockCode" placeholder="輸入股票代碼，例如 2330" onkeypress="checkEnter(event)" />
      <button onclick="loadPage()">查詢</button>
    </div>
  </div>

  <iframe id="stockFrame" src="main04.html"></iframe>

  <script>
    function checkEnter(event) {
      if (event.key === 'Enter') {
        loadPage();
      }
    }

    function loadPage() {
      const code = document.getElementById('stockCode').value.trim();
      if (code) {
        document.getElementById('stockFrame').src = code + '.html';
      }
    }

    function changePage() {
      const page = document.getElementById('pageSelect').value;
      document.getElementById('stockFrame').src = page;
    }
  </script>

</body>
</html>
